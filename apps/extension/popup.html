<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zero Vault</title><link rel="stylesheet" href="ui.css"></head>
<body class="full">
<header><h1>Zero Vault</h1><small>v0.2.0</small></header>
<p class="origin" id="origin"></p>
<p id="feedback" class="status" role="status" aria-live="polite"></p>
<section id="connection"></section>
<section id="pending"></section>
<section id="credentials"></section>
<section id="conflicts"></section>
<details id="generator"><summary>生成密码</summary>
<label for="generated">生成的密码</label><input class="generated" id="generated" readonly spellcheck="false" autocomplete="off">
<label for="length">密码长度（8–128 位）</label><input id="length" type="number" min="8" max="128" value="20">
<div class="checks"><label><input id="upper" type="checkbox" checked>大写字母</label><label><input id="lower" type="checkbox" checked>小写字母</label><label><input id="digits" type="checkbox" checked>数字</label><label><input id="symbols" type="checkbox" checked>符号</label></div>
<div class="actions"><button id="regenerate" type="button">重新生成</button><button id="copy" type="button">复制</button></div><button id="use-generated" type="button">填入当前页面</button>
</details>
<footer><a id="open-vault" href="https://zero-vault-web.pages.dev" target="_blank" rel="noopener">打开网页密码库</a><p class="muted"><small>保存与填充均由你确认。</small></p></footer>
<script type="module" src="dist/popup.js"></script>
</body></html>
