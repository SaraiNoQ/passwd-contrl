appId: com.zerovault.autofillfixture
name: API 36 Credential Provider after Zero Vault process death
tags:
  - api36
  - credential-provider
  - process-death
  - sensitive-credential
---
# The host harness launches the fixture and kills the Zero Vault RN process.
# Starting it again through Maestro would force-stop it and wake the RN task.
- tapOn:
    id: "fixture_credential_button"
# The preceding Autofill journey may leave the independent :vault_system
# process unlocked for its short session. Credential Manager can therefore
# show the candidate directly, or show the biometric authentication entry when
# that session has expired; both paths remain independent of the RN process.
- extendedWaitUntil:
    visible: "^(解锁 Zero Vault|Unlock Zero Vault|Maestro Fixture Login)(,.*)?$"
    timeout: 30000
- runFlow:
    when:
      visible: "^(解锁 Zero Vault|Unlock Zero Vault)(,.*)?$"
    commands:
      - tapOn: "^(解锁 Zero Vault|Unlock Zero Vault)(,.*)?$"
      - extendedWaitUntil:
          visible: "Maestro Fixture Login"
          timeout: 30000
- tapOn: "Maestro Fixture Login"
- extendedWaitUntil:
    visible: "Credential Manager returned a password credential"
    timeout: 30000
- assertVisible: "fixture-user@example.invalid"
