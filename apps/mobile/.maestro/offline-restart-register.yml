appId: com.zerovault.mobile
name: Offline queue process-death account bootstrap
tags:
  - business
  - destructive
  - offline
  - offline-register
---
- launchApp:
    clearState: true
- tapOn: "http://"
- inputText: "127.0.0.1:8081"
- hideKeyboard
- tapOn: "Connect"
- extendedWaitUntil:
    visible: "Continue"
    timeout: 30000
- tapOn: "Continue"
- tapOn: "Close"
- extendedWaitUntil:
    visible: "创建新账户"
    timeout: 30000
- tapOn: "创建新账户"
- tapOn:
    id: "register-email"
- inputText: ${OFFLINE_EMAIL}
- tapOn:
    id: "register-password"
- inputText: ${OFFLINE_PASSWORD}
- hideKeyboard
- tapOn:
    id: "register-password-confirm"
- inputText: ${OFFLINE_PASSWORD}
- hideKeyboard
- tapOn:
    id: "register-submit"
- extendedWaitUntil:
    visible:
      id: "recovery-code-value"
    timeout: 30000
- tapOn:
    id: "recovery-code-acknowledge-start"
- tapOn:
    id: "recovery-code-acknowledge-confirm"
- extendedWaitUntil:
    visible: "解锁密码库"
    timeout: 30000
- tapOn:
    id: "unlock-password"
- inputText: ${OFFLINE_PASSWORD}
- hideKeyboard
- tapOn:
    id: "unlock-submit"
- extendedWaitUntil:
    visible:
      id: "vault-add-item"
    timeout: 30000
