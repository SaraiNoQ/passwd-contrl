appId: com.zerovault.mobile
name: Two-device A advances the same shared baseline
tags:
  - api36
  - two-device
  - conflict
---
- launchApp:
    clearState: false
- runFlow:
    file: subflows/two-device-unlock-if-needed.yml
    env:
      E2E_PASSWORD: ${E2E_PASSWORD}
- runFlow:
    file: subflows/two-device-edit-login.yml
    env:
      ITEM_TITLE: ${ITEM_TITLE}
      ITEM_USERNAME: ${SERVER_USERNAME}
- tapOn:
    id: "vault-sync"
- extendedWaitUntil:
    visible: "同步成功"
    timeout: 30000
- extendedWaitUntil:
    visible: "待同步 0 项"
    timeout: 30000
