appId: com.zerovault.mobile
name: Two-device B receives a shared tombstone
tags:
  - api36
  - two-device
  - delete-sync
---
- launchApp:
    clearState: false
- runFlow:
    file: subflows/two-device-unlock-if-needed.yml
    env:
      E2E_PASSWORD: ${E2E_PASSWORD}
- tapOn:
    id: "vault-sync"
- extendedWaitUntil:
    visible: "同步成功"
    timeout: 30000
- extendedWaitUntil:
    visible: "待同步 0 项"
    timeout: 30000
- assertNotVisible: "打开条目 ${ITEM_TITLE}"
