appId: com.zerovault.mobile
name: Two-device B creates and resolves one real conflict
tags:
  - api36
  - two-device
  - conflict
---
- launchApp:
    clearState: false
- runFlow:
    file: subflows/two-device-unlock-if-needed.yml
    env:
      E2E_PASSWORD: ${E2E_PASSWORD}
- extendedWaitUntil:
    visible: "(处理 1 个冲突|同步冲突)"
    timeout: 30000
- runFlow:
    when:
      visible: "处理 1 个冲突"
    commands:
      - tapOn: "处理 1 个冲突"
- extendedWaitUntil:
    visible: "同步冲突"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "conflict-${CONFLICT_RESOLUTION}-.*"
    direction: DOWN
- tapOn:
    id: "conflict-${CONFLICT_RESOLUTION}-.*"
- scrollUntilVisible:
    element:
      id: "conflict-confirm-.*"
    direction: DOWN
- tapOn:
    id: "conflict-confirm-.*"
- scrollUntilVisible:
    element: "没有待处理冲突"
    direction: UP
- pressKey: Back
- extendedWaitUntil:
    visible:
      id: "vault-sync"
    timeout: 15000
